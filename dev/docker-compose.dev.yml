# ========================================================================
# DEV
# ========================================================================
# Docker Compose 2.20+ (include). Run from the repo root, with env from
# Infisical (`infisical run --env=dev -- make up`):
#   docker compose -f dev/docker-compose.dev.yml up -d
#
# Everything shared lives in ../general/docker-compose.base.yml. This file
# defines frontend + traefik and the dev service overrides.
# Relative paths in this file resolve from dev/.
#
# Image tags come from CONTAINER_TAG: Infisical dev must set CONTAINER_TAG=dev,
# otherwise the base file falls back to the `main` images.
#
# `name: deploy_conf` keeps the volume/network prefixes of the old
# single-file setup. Do not change it.
# ========================================================================

include:
  - path: ../general/docker-compose.base.yml

name: deploy_conf

services:

#  frontend:
#    image: vinasfront/vinas-frontend:dev
#    container_name: frontend
#    platform: linux/amd64
#    restart: unless-stopped
#    ports:
#     - "3000:3000"
#    networks:
#     - traefik_net
#    environment:
#     - NEXT_PUBLIC_API_URL=http://localhost
#     # Server-side rendering runs inside this container, where `localhost` is the
#     # container itself. Reach the auction API directly over the docker network.
#     - LOT_API_URL=http://api_service:8000/public/v1/lot

  # ======================================================================
  # 1. REVERSE PROXY and LOAD BALANCER
  # ======================================================================
  # Traefik handles incoming requests and routes them to appropriate services
  # Provides SSL termination and load balancing capabilities

  traefik:
    image: traefik:v3.5
    container_name: traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true" # Enable Docker provider
      - "--providers.docker.exposedbydefault=false" # Require explicit labels
      - "--entrypoints.web.address=:80" # HTTP entrypoint
      - "--log.level=DEBUG" # Detailed logging
    ports:
      - "80:80" # HTTP traffic
      - "8080:8080" # Traefik dashboard
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/logs:/logs
      - /var/run/docker.sock:/var/run/docker.sock:ro # Docker socket access
    networks:
      - traefik_net

  # ======================================================================
  # DEV OVERRIDES OF SERVICES DEFINED IN THE BASE FILE
  # ======================================================================

  post_generator_bot:
    environment:
      ENVIRONMENT:
      DEBUG:

  favorites_service:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8006"]

  adminer:
    ports:
      - "8090:8080"

  grafana:
    environment:
      - GF_SERVER_HTTP_PORT=3000
